site_name: bl_reader documentation
site_description: Readers and analysis tools for Athena++ boundary-layer simulations

theme:
  name: readthedocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            show_root_heading: true
            show_object_full_path: false

nav:
  - Home: index.md
  - API reference: api.md
