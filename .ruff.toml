# Ruff configuration mirroring .flake8 for Ruff 0.14.0+
line-length = 120

[lint]
ignore = [
    "E402",  # Legacy scripts execute setup code before later imports.
    "E701",  # Preserve compact one-line conditionals in legacy analysis code.
    "E712",  # Preserve legacy truth-value comparisons used by plotting options.
    "E713",  # Preserve legacy membership-test spelling throughout old scripts.
    "E714",  # Preserve legacy None-identity test spelling throughout old scripts.
    "E721",  # Legacy code intentionally distinguishes exact built-in types.
    "E722",  # Legacy broad fallbacks are part of the existing I/O behavior.
    "E741",  # Short scientific loop variables are established notation here.
    "F401",  # Optional plotting/science backends are imported for availability.
    "F403",  # The package uses deliberate helper-module star exports.
    "F405",  # Names supplied by those deliberate helper-module exports.
    "F811",  # Legacy plotting methods intentionally override earlier variants.
    "F841",  # Some legacy assignments intentionally trigger plotting/data access.
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/__init__.py" = ["F401"]
