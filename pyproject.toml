[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bl-reader"
version = "0.1.0"
description = "Readers and analysis tools for Athena++ boundary-layer simulations"
readme = "docs/index.md"
requires-python = ">=3.9"
dependencies = [
    "h5py>=3.8",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.10",
]

[project.optional-dependencies]
extras = [
    "astropy>=5.3",
    "cmocean>=3.0",
    "GitPython>=3.1",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.29",
]
dev = [
    "ruff>=0.15",
]

[tool.setuptools]
package-dir = {"bl_reader" = "."}
packages = ["bl_reader", "bl_reader.simBLclass"]

[tool.uv]
default-groups = ["docs", "dev"]
